version: '3.8'

services:
  # 1. PostgreSQL 15 Database Service
  db:
    image: postgres:15-alpine
    container_name: bugflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bugflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bugflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI BugFlow Web Service
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugflow_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/bugflow_db
      - SECRET_KEY=bugflow_super_secret_jwt_key_2026_enterprise_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
